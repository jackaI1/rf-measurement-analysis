spec: '1.0'
devices:
  generator:
    eom:
      TCPIP INSTR: {q: "\n", r: "\n"}
    dialogues:
      - {q: '*IDN?', r: 'RF-DEMO,SIGNAL-GENERATOR,SIM001,1.0'}
    properties:
      frequency:
        default: 1000000
        getter: {q: 'FREQ?', r: '{:.6f}'}
        setter: {q: 'FREQ {:f}'}
        specs: {min: 1, max: 6000000000, type: float}
      power:
        default: -20
        getter: {q: 'POW?', r: '{:.6f}'}
        setter: {q: 'POW {:f}'}
        specs: {min: -120, max: 20, type: float}
      output:
        default: 0
        getter: {q: 'OUTP?', r: '{:d}'}
        setter: {q: 'OUTP {:d}'}
        specs: {valid: [0, 1], type: int}
  analyzer:
    eom:
      TCPIP INSTR: {q: "\n", r: "\n"}
    dialogues:
      - {q: '*IDN?', r: 'RF-DEMO,SPECTRUM-ANALYZER,SIM002,1.0'}
      - {q: 'INIT:CONT OFF'}
      - {q: 'INIT:IMM'}
      - {q: '*OPC?', r: '1'}
      - {q: 'SWE:POIN?', r: '21'}
      - q: 'TRAC:DATA? TRACE1'
        r: '-90,-90,-89,-90,-88,-87,-85,-80,-60,-30,-10,-30,-60,-80,-85,-87,-88,-90,-89,-90,-90'
    properties:
      center:
        default: 1000000
        getter: {q: 'FREQ:CENT?', r: '{:.6f}'}
        setter: {q: 'FREQ:CENT {:f}'}
        specs: {min: 1, max: 6000000000, type: float}
      span:
        default: 20000
        getter: {q: 'FREQ:SPAN?', r: '{:.6f}'}
        setter: {q: 'FREQ:SPAN {:f}'}
        specs: {min: 1, max: 1000000000, type: float}
resources:
  TCPIP::generator::INSTR: {device: generator}
  TCPIP::analyzer::INSTR: {device: analyzer}
