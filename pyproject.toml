[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rf-measurement-analysis"
version = "0.1.0"
description = "Touchstone and amplifier bench measurement analysis with reproducible reports"
requires-python = ">=3.11"
dependencies = ["scikit-rf>=1.6,<3", "numpy>=2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
rf-analysis = "rf_measurement.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_measurement"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
