name: tests
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=rf_measurement --cov-report=term-missing --cov-fail-under=90
      - name: Run installed commands outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          rf-sweep --output sweep-demo
          rf-dsp-demo --output dsp-demo
