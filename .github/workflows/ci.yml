name: RF analysis CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev --no-editable
      - run: uv run --no-editable ruff check src tests
      - run: uv run --no-editable ruff format --check src tests
      - run: uv run --no-editable pytest --cov=rf_measurement --cov-report=term-missing --cov-report=xml --cov-fail-under=90 -q
      - run: uv run --no-editable rf-analysis demo --output reports/ci-demo
      - run: uv build
      - name: Run installed acquisition commands outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/rf-sweep" --output sweep-demo
          "$GITHUB_WORKSPACE/.venv/bin/rf-dsp-demo" --output dsp-demo
      - uses: actions/upload-artifact@v4
        with:
          name: rf-report-python-${{ matrix.python }}
          path: reports/ci-demo/
